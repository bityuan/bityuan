Title="bityuan"
FixTime=false

[log]
# 日志级别，支持debug(dbug)/info/warn/error(eror)/crit
loglevel = "debug"
logConsoleLevel = "info"
# 日志文件名，可带目录，所有生成的日志文件都放到此目录下
logFile = "logs/chain33.log"
# 单个日志文件的最大值（单位：兆）
maxFileSize = 300
# 最多保存的历史日志文件个数
maxBackups = 100
# 最多保存的历史日志消息（单位：天）
maxAge = 28
# 日志文件名是否使用本地事件（否则使用UTC时间）
localTime = true
# 历史日志文件是否压缩（压缩格式为gz）
compress = true
# 是否打印调用源文件和行号
callerFile = false
# 是否打印调用方法
callerFunction = false

[blockchain]
dbPath="datadir"
# dbCache sets three leveldb parameters at once (chain33/common/db/go_level_db.go):
#   handles = dbCache;  block cache = dbCache/2 MiB;  write buffer = min(dbCache/4, 16) MiB
# A full node has the largest DB (TB-scale, hundreds of thousands of SST files), so handles bind
# first here. Left at the default 64 -- raising it has not been measured to help. 0 = default;
# a restart is required.
dbCache=64
batchsync=false
isRecordBlockSequence=true
enableTxQuickIndex=true
# 升级storedb是否重新执行localdb，bityuan主链升级不需要开启，平行链升级需要开启
enableReExecLocal=false
# 使能精简localdb
# 警告：isRecordBlockSequence/enableReduceLocaldb 是"单向门"，已同步节点改值
# 不会补回历史数据，一般需要重同步。本文件按"服务全网的种子/全节点"配置：
# isFullNode=true（保存所有分片数据）、isRecordBlockSequence=true、enableReduceLocaldb=false。
enableReduceLocaldb=false
# 是否禁止分片功能，默认开启分片功能
disableShard=false
# 使能从P2pStore中获取数据
enableFetchP2pstore=true

[p2p]
types=["dht"]
dbPath="datadir/addrbook"
# The addrbook DB is small (a few MB); leave at the default. Same semantics as [blockchain] dbCache.
dbCache=4
grpcLogFile="grpc33.log"
#waitPid 等待seed导入
waitPid=false

[p2p.sub.gossip]
port=13802
seeds=[]
isSeed=false
innerSeedEnable=true
useGithub=true
innerBounds=300

[p2p.sub.dht]
#自定义追加的引导节点。内置引导节点编译在主网配置里（改需发版）；
#此处只追加自有节点，不要写 bootstraps（与编译键重名会导致启动 panic）。
seeds=[]
port=13803
maxConnectNum=300
# 是否配置为全节点模式，全节点保存所有分片数据，种子节点应配置为true
# 全节点模式见本文件：isFullNode/isRecordBlockSequence/enableReduceLocaldb 三处一起配
isFullNode=true
#允许连接的最低版本：是 floor 语义（允许该版本及以上），不是当前版本。
#6.9.1 发布时亲手抬到 6.9.0；"何时抬 floor"等于决定踢掉旧节点，改前请显式确认。
verLimit="6.9.0"

[p2p.sub.dht.pubsub]
gossipSubDlo=7
gossipSubD=10
gossipSubDhi=20
gossipSubHeartbeatInterval=900
gossipSubHistoryGossip=2
gossipSubHistoryLength=7


[rpc]
# RPC 安全只靠 bind 地址：只监听回环，本机之外 TCP 层连不进来。
# 注意 Go 监听 "localhost" 只绑定解析出的其中一个地址（v4/v6 二选一，不保证是哪一个），
# 写死 127.0.0.1 保证行为确定；切勿改成 0.0.0.0（见下黑名单说明）。
jrpcBindAddr="127.0.0.1:8801"
grpcBindAddr="127.0.0.1:8802"
# IP 白名单：回环地址框架无条件放行，本行只对非回环生效；
# 因上面已绑定回环，此处是纵深防御，不要删除。
whitelist=["127.0.0.1"]
# 钱包敏感接口黑名单：本文件独有（bityuan.toml 只配白名单、未配黑名单）。本机 bityuan-cli 走 JRPC
# 回环，不受影响（JRPC 回环跳过函数检查）；走 gRPC 的调用（含回环）会被这张表拦下。
jrpcFuncBlacklist=["SendToAddress","Lock","UnLock","SetPasswd","NewAccount","GetAccounts","MergeBalance","ImportPrivKey","WalletTransactionList","DumpPrivkey","SaveSeed","GetSeed"]
grpcFuncBlacklist=["SendToAddress","Lock","UnLock","SetPasswd","NewAccount","GetAccounts","MergeBalance","ImportPrivKey","WalletTransactionList","DumpPrivkey","SaveSeed","GetSeed"]
enableTLS=false
certFile="cert.pem"
keyFile="key.pem"

[rpc.sub.eth]
# EVM 兼容 RPC：供 MetaMask/ethers.js 等以太坊生态工具使用，
# 底层仍是本链 EVM 执行器，不是 geth 节点。
enable=true
# 同 [rpc]：只绑回环。personal（含账户解锁，敏感）/admin（节点管理，敏感）
# 默认开启，仅限本机可信进程；对外服务必须经反向代理并裁掉这两个命名空间。
httpAddr="127.0.0.1:8546"
# eth: 余额/交易/合约调用；web3: 客户端版本；net: 网络 ID；personal/admin 见上。
httpApi=["eth","web3","personal","admin","net"]
# websocket 绑定地址（订阅 logs/新区块头用）
wsAddr="127.0.0.1:8547"
wsApi=["eth","web3","personal","admin","net"]
#兼容交易返回eth 哈希
enableRlpTxHash=true
#启动快速估算gas
disableQuickGas=false

[mempool]
maxTxNumPerAccount=100

[store]
dbPath="datadir/mavltree"
# State DB (mavltree); same semantics as [blockchain] dbCache.
dbCache=128

[store.sub.mavl]
enableMavlPrefix=true
enableMVCC=false
enableMavlPrune=true
pruneHeight=10000
enableMemTree=true
enableMemVal=true
# 缓存close ticket数目，该缓存越大同步速度越快，最大设置到1500000,默认200000
tkCloseCacheLen=200000

[store.sub.kvmvccmavl]
enableMVCCIter=true
enableMavlPrefix=true
enableMVCC=false
enableMavlPrune=true
pruneMavlHeight=10000
enableMVCCPrune=false
pruneMVCCHeight=10000
enableMemTree=true
enableMemVal=true
# 缓存close ticket数目，该缓存越大同步速度越快，最大设置到1500000,默认200000
tkCloseCacheLen=200000

[wallet]
dbPath="wallet"
# The wallet DB is small; leave at the default. Same semantics as [blockchain] dbCache.
dbCache=16

[wallet.sub.ticket]
minerdisable=false
minerwhitelist=["*"]

[exec]
enableStat=false
enableMVCC=false

[exec.sub.token]
saveTokenTxList=false

[metrics]
#是否使能发送metrics数据的发送
enableMetrics=false
#数据保存模式
dataEmitMode="influxdb"

[metrics.sub.influxdb]
#以纳秒为单位的发送间隔
duration=1000000000
url="http://influxdb:8086"
database="chain33metrics"
username=""
password=""
namespace=""

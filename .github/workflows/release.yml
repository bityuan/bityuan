# 发布流程、失败时怎么手动补包：见 .github/RELEASE.md
name: release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      manual_upload:
        # 这段说明会显示在 Actions 页面 "Run workflow" 的弹窗里
        description: '要重新打包并上传的 release tag（如 v6.9.0）；用法见 .github/RELEASE.md'
        required: true
        default: ''
        type: string

jobs:
  check:
    name: Check release commit
    runs-on: ubuntu-22.04
    outputs:
      is_release: ${{ steps.chk.outputs.is_release }}
      release_tag: ${{ steps.chk.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
      - id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.manual_upload }}" ]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "release_tag=${{ inputs.manual_upload }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # 非 chore(release) commit 直接跳过
          MSG=$(git log -1 --format=%s)
          if [[ "$MSG" != chore\(release\):* ]]; then
            echo "is_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # release commit 已把 version/version.go 更新为新版本，tag 名由它推导
          # 注意：semantic-release 先推 commit 再推 tag，此 job 里 tag 可能还不存在，
          # 所以这里不查 API，等 tag 的校验放到 upload-win-mac 里做
          VER=$(sed -n 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"\([0-9][0-9.]*\)".*/\1/p' version/version.go | head -1)
          if [ -z "$VER" ]; then
            echo "无法从 version/version.go 解析版本号" >&2
            echo "is_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "is_release=true" >> $GITHUB_OUTPUT
          echo "release_tag=v$VER" >> $GITHUB_OUTPUT

  build-windows:
    name: Build Windows (MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.manual_upload }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          version: '8.1.0'
      - name: Build Windows binaries
        run: |
          $env:CGO_ENABLED = "1"
          $gc = git rev-parse --short=8 HEAD
          go build -ldflags "-s -w -X github.com/bityuan/bityuan/version.GitCommit=$gc -X github.com/33cn/chain33/common/version.GitCommit=$gc" -o bityuan.exe .
          go build -ldflags "-s -w -X github.com/bityuan/bityuan/version.GitCommit=$gc -X github.com/33cn/chain33/common/version.GitCommit=$gc" -o bityuan-cli.exe ./cli

      # 三平台共用同一份校验脚本（见 .github/scripts/smoke_test.py）
      - name: Smoke test
        run: |
          $gc = git rev-parse --short=8 HEAD
          python .github/scripts/smoke_test.py --node bityuan.exe --cli bityuan-cli.exe --commit $gc --out version-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Qt installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          choco install 7zip -y 2>$null
          choco install winrar -y 2>$null
          Write-Host "Downloading Qt shell from v6.8.18..."
          gh release download v6.8.18 --repo bityuan/bityuan --pattern "*windows*" --dir qt-shell --clobber
          $shell = (Get-ChildItem qt-shell | Select-Object -First 1).FullName
          # 用 WinRAR 原地更新老包内部文件，保留 WinRAR SFX 壳和 Setup 配置
          Copy-Item $shell bityuan-windows-amd64-qt.exe
          & "C:\Program Files\WinRAR\Rar.exe" u bityuan-windows-amd64-qt.exe bityuan.exe bityuan-cli.exe bityuan.toml bityuan-fullnode.toml 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "WinRAR update failed" }
          # 删除旧 32 位二进制（只保留 64 位）
          & "C:\Program Files\WinRAR\Rar.exe" d bityuan-windows-amd64-qt.exe bityuan-x86.exe bityuan-cli-x86.exe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "WinRAR delete x86 failed" }
          Compress-Archive -Path bityuan.exe,bityuan-cli.exe,bityuan.toml,bityuan-fullnode.toml -DestinationPath bityuan-windows-amd64.zip

      # 打包是"拿旧 SFX 壳原地替换文件"，这一步校验替换真的生效了
      - name: Verify Qt package
        run: |
          $ErrorActionPreference = "Stop"
          $7z = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path $7z)) { $7z = "7z" }
          $list = & $7z l bityuan-windows-amd64-qt.exe | Out-String
          # SFX 壳和脚本必须完整保留
          foreach ($pat in @("Setup=bityuan-qt\.exe", "Shortcut=", "Title=")) {
            if ($list -notmatch $pat) { throw "Qt 包的 SFX 脚本丢了：$pat" }
          }
          # 32 位二进制必须已被删除
          foreach ($f in @("bityuan-x86.exe", "bityuan-cli-x86.exe")) {
            if ($list -match [regex]::Escape($f)) { throw "Qt 包里残留 32 位文件 $f" }
          }
          # 包里的二进制必须与刚构建（且已冒烟测试过）的那两个字节一致
          New-Item -ItemType Directory -Force -Path qt-verify | Out-Null
          & $7z e bityuan-windows-amd64-qt.exe bityuan.exe bityuan-cli.exe -oqt-verify -y | Out-Null
          foreach ($f in @("bityuan.exe", "bityuan-cli.exe")) {
            $built = (Get-FileHash $f -Algorithm SHA256).Hash
            $packed = (Get-FileHash "qt-verify\$f" -Algorithm SHA256).Hash
            if ($built -ne $packed) { throw "$f 与 Zip 包里的不一致，说明 Rar 替换没生效" }
          }
          Write-Host "Qt 包校验通过：脚本完整、无 32 位残留、内部二进制与构建产物 sha256 一致"

      - uses: actions/upload-artifact@v5
        with:
          name: windows-qt-exe
          path: bityuan-windows-amd64-qt.exe
      - uses: actions/upload-artifact@v5
        with:
          name: windows-binaries
          path: bityuan-windows-amd64.zip
      - uses: actions/upload-artifact@v5
        with:
          name: version-windows
          path: version-windows.json

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [arm64, amd64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.manual_upload }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build macOS
        run: |
          GC=$(git rev-parse --short=8 HEAD)
          CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.arch }} go build -ldflags "-s -w -X github.com/bityuan/bityuan/version.GitCommit=$GC -X github.com/33cn/chain33/common/version.GitCommit=$GC" -o bityuan .
          CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.arch }} go build -ldflags "-s -w -X github.com/bityuan/bityuan/version.GitCommit=$GC -X github.com/33cn/chain33/common/version.GitCommit=$GC" -o bityuan-cli ./cli
          chmod +x bityuan bityuan-cli
          mkdir -p build
          tar -zcvf build/bityuan-darwin-${{ matrix.arch }}.tar.gz bityuan bityuan-cli bityuan.toml bityuan-fullnode.toml CHANGELOG.md

      # 三平台共用同一份校验脚本；runner 是 arm64，amd64 产物靠 Rosetta 跑
      - name: Smoke test
        run: |
          OUT=version-darwin-${{ matrix.arch }}.json
          PREFIX=""
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              PREFIX="--runner-prefix arch -x86_64"
            else
              echo "::warning::runner 上没有 Rosetta，amd64 产物本次未做冒烟测试"
              echo '{"_platform":"Darwin-amd64","_skipped":true}' > "$OUT"
              exit 0
            fi
          fi
          python3 .github/scripts/smoke_test.py --node ./bityuan --cli ./bityuan-cli \
            --commit "$(git rev-parse --short=8 HEAD)" --out "$OUT" $PREFIX

      - uses: actions/upload-artifact@v5
        with:
          name: darwin-${{ matrix.arch }}
          path: build/bityuan-darwin-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: version-darwin-${{ matrix.arch }}
          path: version-darwin-${{ matrix.arch }}.json

  build-linux:
    name: Build Linux (zig cc)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install zig
        uses: ./.github/actions/zig-install
      - name: Build Linux
        run: CC='zig cc -target x86_64-linux-gnu.2.17' make linux-action-amd64

      # 三平台共用同一份校验脚本（见 .github/scripts/smoke_test.py）
      - name: Smoke test
        run: |
          python3 .github/scripts/smoke_test.py --node ./bityuan-linux-amd64 --cli ./bityuan-cli-linux-amd64 \
            --commit "$(git rev-parse --short=8 HEAD)" --out version-linux.json

      - uses: actions/upload-artifact@v5
        with:
          name: version-linux
          path: version-linux.json

  release-linux:
    name: Release Linux
    # release commit 由 semantic-release 自己推送，不能再次触发 semantic-release
    # （否则会连锁生成重复的 chore(release) commit，并因 tag 已存在而失败）
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    concurrency:
      group: semantic-release
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install zig
        uses: ./.github/actions/zig-install
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          branch: master
          extra_plugins: |
            conventional-changelog-jshint@5.2.0
            semantic-release-replace-plugin@1.2.7
            @semantic-release/exec@6
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  upload-win-mac:
    name: Upload Windows/macOS packages
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.manual_upload != '') ||
      (github.event_name != 'pull_request' && needs.check.outputs.is_release == 'true')
    needs: [check, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Windows/macOS artifacts
        uses: actions/download-artifact@v5
        with:
          path: build/
          pattern: "*"
          merge-multiple: true
      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ inputs.manual_upload }}" ]; then
            echo "tag=${{ inputs.manual_upload }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ needs.check.outputs.release_tag }}" >> $GITHUB_OUTPUT
          fi
      # semantic-release 先推 commit、后推 tag（且上传产物耗时数分钟），
      # 本 job 起跑时 tag/release 可能还没建好，这里等一下（最多 10 分钟）
      - name: Wait for release tag
        if: inputs.manual_upload == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.tag.outputs.tag }}"
          SHA=""
          for i in $(seq 1 60); do
            SHA=$(gh api "repos/bityuan/bityuan/git/ref/tags/$V" --jq .object.sha 2>/dev/null) || SHA=""
            if [ -n "$SHA" ]; then
              echo "tag $V -> $SHA (head ${{ github.sha }})"
              break
            fi
            echo "waiting for tag $V ... ($i/60)"
            sleep 10
          done
          if [ -z "$SHA" ]; then
            echo "tag $V 未出现，放弃上传" >&2
            exit 1
          fi

      # build-linux 不在 needs 里（workflow_dispatch 时它会被跳过），
      # 所以这里等它的冒烟结果出现；它失败则没有产物，直接终止
      - name: Wait for linux smoke result
        if: inputs.manual_upload == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            if gh api "repos/bityuan/bityuan/actions/runs/${{ github.run_id }}/artifacts" \
                 --jq '.artifacts[].name' 2>/dev/null | grep -qx "version-linux"; then
              echo "version-linux 冒烟结果已就绪"
              exit 0
            fi
            STATE=$(gh api "repos/bityuan/bityuan/actions/runs/${{ github.run_id }}/jobs" \
                      --jq '.jobs[] | select(.name | startswith("Build Linux")) | .status + "/" + (.conclusion // "-")' 2>/dev/null | head -1)
            echo "等待 version-linux 产物 ... ($i/60) build-linux=${STATE:-未知}"
            case "$STATE" in
              completed/failure|completed/cancelled|completed/skipped)
                echo "build-linux 已结束却没有冒烟结果，终止上传" >&2
                exit 1 ;;
            esac
            sleep 10
          done
          echo "等不到 version-linux 冒烟结果" >&2
          exit 1

      # 产物是快照，要重新拉一次才能带上刚就绪的 linux 结果
      - name: Re-download artifacts
        if: inputs.manual_upload == ''
        uses: actions/download-artifact@v5
        with:
          path: build/
          pattern: "*"
          merge-multiple: true

      # 各平台冒烟测试的结论必须一致，否则不上传（缺哪个平台的 json 就说明那个平台没通过）
      - name: Compare platform versions
        run: |
          if [ -n "${{ inputs.manual_upload }}" ]; then
            python3 .github/scripts/compare_versions.py --allow-partial "build/version-*.json"
          else
            python3 .github/scripts/compare_versions.py "build/version-*.json"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          V="${{ steps.tag.outputs.tag }}"
          echo "Uploading win/mac packages to $V"
          gh release upload "$V" --repo bityuan/bityuan build/bityuan-windows-amd64-qt.exe build/bityuan-windows-amd64.zip build/bityuan-darwin-amd64.tar.gz build/bityuan-darwin-arm64.tar.gz --clobber
      # 产物 sha256 清单（取自 GitHub API 的 digest，无需重新下载几十 MB）
      - name: Write SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          V="${{ steps.tag.outputs.tag }}"
          gh api "repos/bityuan/bityuan/releases/tags/$V" \
            --jq '.assets[] | select(.name != "SHA256SUMS") | "\(.digest | sub("sha256:"; ""))  \(.name)"' \
            | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$V" --repo bityuan/bityuan SHA256SUMS --clobber
      - name: Add footer to release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          V="${{ steps.tag.outputs.tag }}"
          BODY=$(gh release view "$V" --repo bityuan/bityuan --json body -q .body)
          if echo "$BODY" | grep -q "System Requirements"; then
            echo "Footer already present, skip"
            exit 0
          fi
          FOOTER="\n\n---\n\n### System Requirements\n\n**Linux** (glibc >= 2.17): Ubuntu 18.04+, Debian 10+, CentOS 7+, RHEL 7+, Rocky 8+, Alma 8+\n\n**Windows**: Windows 10+, Windows Server 2016+"
          printf "%b" "$BODY$FOOTER" | gh release edit "$V" --repo bityuan/bityuan -F -

name: release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    name: Build Windows (MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          version: '8.1.0'
      - name: Build Windows binaries
        run: make windows-release

      - name: Smoke test
        run: |
          echo "Starting node..."
          Start-Process -FilePath ".\bityuan-windows-amd64.exe" -NoNewWindow -PassThru | ForEach-Object {
            for ($i=0; $i -lt 10; $i++) {
              Start-Sleep 2
              try {
                $v = & .\bityuan-cli-windows-amd64.exe version 2>$null | ConvertFrom-Json
                if ($v.title -eq 'bityuan' -and $v.app -match '^\d+\.\d+\.\d+' -and $v.chain33 -match '^\d+\.\d+\.\d+-\w+') {
                  echo "OK: $($v | ConvertTo-Json -Compress)"
                  break
                }
              } catch {}
            }
            Stop-Process -Id $_.Id -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: "*.exe"

  build-linux:
    name: Build Linux (zig cc)
    needs: build-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install zig
        run: |
          curl -sSfL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | sudo tar -xJ --strip-components=1 -C /usr/local
          sudo ln -sf /usr/local/zig /usr/local/bin/zig
          zig version
      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
      - name: Build Linux and test Qt packaging
        run: |
          sudo apt-get install -y p7zip-full
          CC='zig cc -target x86_64-linux-gnu.2.17' make linux-action-amd64
          make windows-qt-package PREV_RELEASE_TAG=v6.8.21
          echo "=== Qt package ===" && ls -la build/bityuan-windows-amd64-qt.zip && unzip -l build/bityuan-windows-amd64-qt.zip | grep bityuan

  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
      - name: Install zig
        run: |
          curl -sSfL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | sudo tar -xJ --strip-components=1 -C /usr/local
          sudo ln -sf /usr/local/zig /usr/local/bin/zig
          zig version
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          branch: master
          extra_plugins: |
            conventional-changelog-jshint@5.2.0
            semantic-release-replace-plugin@1.2.7
            @semantic-release/exec@6
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Add footer and show version
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          V="${{ steps.semantic.outputs.new_release_version }}"
          echo "Published: $V"
          FOOTER="\n\n---\n\n### System Requirements\n\n**Linux**\n$(cat COMPAT.txt)\n\n**Windows**: Windows 10+, Windows Server 2016+"
          BODY=$(gh release view "$V" --repo bityuan/bityuan --json body -q .body)
          printf "%b" "$BODY$FOOTER" | gh release edit "$V" --repo bityuan/bityuan -F -
